<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPES Provision — Python ↔ Pseudo</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --hl: #388bfd33;
      --hl-line: #58a6ff;
      --write: #3fb950;
      --read: #d2a8ff;
      --code-bg: #0d1117;
      --gutter: #21262d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
    }
    header h1 { margin: 0; font-size: 1rem; font-weight: 600; }
    header .sub { color: var(--muted); font-size: 0.82rem; }
    .lang-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .lang-toggle button {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 0.4rem 0.85rem;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .lang-toggle button.active {
      background: var(--accent);
      color: #0d1117;
      font-weight: 600;
    }
    .layout {
      display: grid;
      grid-template-columns: 220px 1fr 320px;
      height: calc(100vh - 52px);
    }
    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; height: auto; }
      aside.steps { max-height: 200px; }
    }
    aside.steps {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 0.5rem;
      background: var(--panel);
    }
    aside.steps h2 {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0.5rem 0.25rem;
    }
    aside.steps button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.45rem 0.5rem;
      margin-bottom: 0.2rem;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font-size: 0.78rem;
      cursor: pointer;
    }
    aside.steps button:hover { background: #21262d; }
    aside.steps button.active {
      border-color: var(--accent);
      background: #1c2d41;
    }
    aside.steps button .n { font-family: ui-monospace, monospace; color: var(--accent); font-size: 0.7rem; }
    .code-wrap {
      overflow: auto;
      border-right: 1px solid var(--border);
      background: var(--code-bg);
    }
    .code-meta {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0.75rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
    }
  .code-meta strong { color: var(--text); }
    pre.code {
      margin: 0;
      padding: 0.5rem 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.75rem;
      line-height: 1.55;
    }
    .line {
      display: flex;
      padding: 0 0.5rem 0 0;
    }
    .line:hover { background: #161b2288; }
    .line.active { background: var(--hl); box-shadow: inset 3px 0 0 var(--hl-line); }
    .line.active.dim { opacity: 0.35; }
    .gutter {
      flex: 0 0 3.25rem;
      text-align: right;
      padding-right: 0.75rem;
      color: var(--muted);
      user-select: none;
      border-right: 1px solid var(--border);
      margin-right: 0.75rem;
    }
    .gutter.linked { color: var(--accent); font-weight: 600; }
    .src { white-space: pre; flex: 1; }
    .kw { color: #ff7b72; }
    .fn { color: #d2a8ff; }
    .cm { color: #8b949e; font-style: italic; }
    .str { color: #a5d6ff; }
    .num { color: #79c0ff; }
    aside.vars {
      overflow-y: auto;
      padding: 0.75rem;
      background: var(--panel);
    }
    aside.vars h2 { margin: 0 0 0.5rem; font-size: 0.9rem; }
    aside.vars .step-title { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.75rem; }
    table.vt { width: 100%; border-collapse: collapse; font-size: 0.76rem; }
    table.vt th, table.vt td {
      border: 1px solid var(--border);
      padding: 0.35rem 0.45rem;
      vertical-align: top;
    }
    table.vt th { background: var(--gutter); color: var(--muted); font-size: 0.65rem; text-transform: uppercase; }
    .role-read { color: var(--read); }
    .role-write { color: var(--write); }
    .role-both { color: var(--accent); }
    .footer-note { font-size: 0.72rem; color: var(--muted); margin-top: 0.75rem; line-height: 1.4; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>SPES provision — Python ↔ pseudo debugger</h1>
      <div class="sub"><code>repro_run.py</code> cell 68 · click a step or highlighted line</div>
    </div>
    <div class="lang-toggle" role="tablist">
      <button type="button" id="btn-py" class="active" aria-selected="true">Python</button>
      <button type="button" id="btn-pseudo" aria-selected="false">Pseudo (Alg. 1)</button>
    </div>
  </header>
  <div class="layout">
    <aside class="steps" id="step-nav"></aside>
    <section class="code-wrap">
      <div class="code-meta">
        <span>Viewing: <strong id="view-label">Python</strong></span>
        <span id="anchor-label">Step 1</span>
        <span id="line-xref" style="margin-left:auto;font-family:ui-monospace,monospace"></span>
      </div>
      <pre class="code" id="code-python"></pre>
      <pre class="code hidden" id="code-pseudo"></pre>
    </section>
    <aside class="vars">
      <h2>Variables</h2>
      <div class="step-title" id="var-step-title"></div>
      <table class="vt">
        <thead>
          <tr>
            <th>Role</th>
            <th>Python</th>
            <th>Paper</th>
            <th>At this line</th>
          </tr>
        </thead>
        <tbody id="var-tbody"></tbody>
      </table>
      <p class="footer-note" id="var-foot"></p>
    </aside>
  </div>
  <script src="py-lines.js"></script>
  <script>
    const PY_LINES = window.PY_LINES;

    const PSEUDO_LINES = ` 1|def Provision(FList, FState, Invo, MemSet, UCorr, t):
 2|    for f in FList:
 3|        if Invo[t][f] > 0:
 4|            FState[f].last_invoked ← t
 5|            FState[f].update_WTs(FState[f].current_WT)
 6|            FState[f].current_WT ← 0
 7|            FState[f].update_predictive_values(t)
 8|            if f ∉ MemSet:
 9|                FState[f].cold_start_record(t)
10|                MemSet.add(f)
11|        else:
12|            FState[f].current_WT += 1
13|            pre_load_flag ← FState[f].pre_load(θ_prewarm)
14|            if (not pre_load_flag) and FState[f].current_WT ≥ θ_givenup:
15|                MemSet.remove(f)
16|            elif pre_load_flag:
17|                MemSet.add(f)   // pre-loading
18|        UCorr.update()
19|    return MemSet, FState, UCorr`.trim().split('\n');

    /** Steps link pseudo line(s) ↔ python line(s) + var table */
    const STEPS = [
      {
        id: 1,
        title: 'Outer loop — each minute t',
        pseudo: [1, 2],
        py: [1189, 1193],
        foot: 'Python shuffles func_corr_lst; paper omits.',
        vars: [
          { role: 'read', py: 'i', paper: 't', at: 'Current simulation minute' },
          { role: 'read', py: 'func_lst + func_corr_lst', paper: 'FList', at: 'All functions processed this t' },
        ],
      },
      {
        id: 2,
        title: 'Branch — invoked?',
        pseudo: [3],
        py: [1196],
        vars: [
          { role: 'read', py: 'test_func_arrcount[func][i]', paper: 'Invo[t][f]', at: '> 0 ⇒ invoke branch' },
          { role: 'read', py: 'func_class[func].type', paper: '—', at: 'Schedules GIVE_UP / prewarm shape' },
        ],
      },
      {
        id: 3,
        title: 'Invoke — metrics (extra in code)',
        pseudo: [3],
        py: [1197, 1198],
        vars: [
          { role: 'write', py: 'func_invok[func]', paper: '—', at: '+= invocation count' },
          { role: 'write', py: 'func_invok_bool[func]', paper: '—', at: '+= 1 if any invoke' },
        ],
      },
      {
        id: 4,
        title: 'Invoke — cold start',
        pseudo: [8, 9, 10],
        py: [1200, 1201, 1202, 1203],
        foot: 'Guard: not func_class[func].state',
        vars: [
          { role: 'read', py: 'func_class[func].state', paper: 'f ∈ MemSet?', at: 'False → cold' },
          { role: 'write', py: 'func_cold[func]', paper: 'cold_start_record', at: '+= 1' },
          { role: 'write', py: 'state, load_time', paper: 'FState', at: 'load(i)' },
          { role: 'write', py: 'memory', paper: 'MemSet', at: 'add(f)' },
        ],
      },
      {
        id: 5,
        title: 'Invoke — new idle gap → history',
        pseudo: [5],
        py: [1205, 1206, 1207],
        foot: 'Only if wait_time is None or > 0',
        vars: [
          { role: 'read', py: 'wait_time', paper: 'current_WT', at: 'Gap ended' },
          { role: 'write', py: 'adp_wait', paper: 'history WTs', at: 'append gap' },
          { role: 'write', py: 'pre_call_start', paper: '—', at: '= i' },
        ],
      },
      {
        id: 6,
        title: 'Invoke — adapt predictions',
        pseudo: [5, 7],
        py: [1209],
        pyRange: [1210, 1262],
        foot: 'SHIFT block: update_WTs + update_predictive_values(t)',
        vars: [
          { role: 'both', py: 'pred_interval, idle_info', paper: 'predictive values', at: 'Type-specific update' },
          { role: 'write', py: 'type', paper: '—', at: 'UNKNOWN may → NEW_POSS' },
        ],
      },
      {
        id: 7,
        title: 'Invoke — reset WT, last call',
        pseudo: [4, 6],
        py: [1264, 1265],
        vars: [
          { role: 'write', py: 'wait_time', paper: 'current_WT', at: '← 0' },
          { role: 'write', py: 'last_call', paper: 'last_invoked', at: '← i' },
        ],
      },
      {
        id: 8,
        title: 'Invoke — refresh prediction windows',
        pseudo: [7],
        py: [1268],
        pyRange: [1269, 1294],
        foot: 'next_invok_start + correlation fan-out (not in Alg. 1 box)',
        vars: [
          { role: 'write', py: 'next_invok_start', paper: 'pre_load input', at: 'Intervals from i + pred_interval' },
          { role: 'write', py: 'func_class[target].next_invok_start', paper: '—', at: 'Via candi_func_tuplelst / UCorr' },
        ],
      },
      {
        id: 9,
        title: 'Idle — increment wait time',
        pseudo: [12],
        py: [1298, 1299, 1300, 1301],
        vars: [
          { role: 'write', py: 'wait_time', paper: 'current_WT', at: '+= 1 (or init 1)' },
        ],
      },
      {
        id: 10,
        title: 'Idle — WMT accounting',
        pseudo: [12],
        py: [1303, 1304, 1305, 1306],
        vars: [
          { role: 'read', py: 'memory', paper: 'MemSet', at: 'f ∈ memory?' },
          { role: 'write', py: 'waste_mem_time, func_waste', paper: '—', at: 'Metrics only' },
        ],
      },
      {
        id: 11,
        title: 'Idle — pre_load(θ_prewarm)',
        pseudo: [13],
        py: [1309],
        pyRange: [1311, 1328],
        foot: 'pre_warm_flag; PRE_WARM=2; CORR uses nested dict (1322–1328)',
        vars: [
          { role: 'read', py: 'next_invok_start', paper: 'θ_prewarm windows', at: '[left, right] vs i' },
          { role: 'write', py: 'pre_warm_flag', paper: 'pre_load_flag', at: 'True if window hits' },
        ],
      },
      {
        id: 12,
        title: 'Idle — evict',
        pseudo: [14, 15],
        py: [1330, 1331, 1332],
        foot: 'Also requires state (loaded); uses GIVE_UP[_type] not single θ',
        vars: [
          { role: 'read', py: 'pre_warm_flag', paper: 'pre_load_flag', at: 'Must be False' },
          { role: 'read', py: 'GIVE_UP[_type]', paper: 'θ_givenup', at: 'wait_time ≥ threshold' },
          { role: 'write', py: 'memory', paper: 'MemSet', at: 'remove(f)' },
          { role: 'write', py: 'state, load_time', paper: 'FState', at: 'unload()' },
        ],
      },
      {
        id: 13,
        title: 'Idle — pre-load',
        pseudo: [16, 17],
        py: [1334, 1335, 1336],
        vars: [
          { role: 'write', py: 'memory', paper: 'MemSet', at: 'add(f)' },
          { role: 'write', py: 'state, load_time', paper: 'FState', at: 'load(i) even if warm' },
        ],
      },
      {
        id: 14,
        title: 'UCorr.update (placement differs)',
        pseudo: [18],
        py: [1338],
        pyRange: [1339, 1353],
        foot: 'Paper: inside for-f loop. Code: after all f each minute.',
        vars: [
          { role: 'write', py: 'test_func_corr_perform', paper: 'UCorr', at: 'Co-invoke counts' },
          { role: 'write', py: 'test_func_corr', paper: 'UCorr', at: 'Prune weak candidates' },
          { role: 'read', py: 'memory_size', paper: '—', at: 'len(memory) snapshot @1338' },
        ],
      },
    ];

    let lang = 'py';
    let activeStep = 0;

    function parseLine(row) {
      const i = row.indexOf('|');
      return { num: parseInt(row.slice(0, i), 10), text: row.slice(i + 1) };
    }

    function highlightPython(text) {
      return text
        .replace(/(#.*)$/, '<span class="cm">$1</span>')
        .replace(/\b(if|else|elif|for|in|not|and|or|def|with|as|break|return)\b/g, '<span class="kw">$1</span>')
        .replace(/\b(range|len|random|shuffle)\b/g, '<span class="fn">$1</span>');
    }

    function highlightPseudo(text) {
      return text
        .replace(/(\/\/.*)$/, '<span class="cm">$1</span>')
        .replace(/\b(def|for|if|else|elif|in|not|and|return)\b/g, '<span class="kw">$1</span>')
        .replace(/←|≥|∉/g, '<span class="num">$&</span>');
    }

    function lineNumsForStep(step, mode) {
      const arr = [...(mode === 'py' ? step.py : step.pseudo)];
      if (mode === 'py' && step.pyRange) {
        for (let n = step.pyRange[0]; n <= step.pyRange[1]; n++) arr.push(n);
      }
      return arr;
    }

    function lineInStep(lineNum, step, mode) {
      return lineNumsForStep(step, mode).includes(lineNum);
    }

    function fmtSpan(nums) {
      if (!nums.length) return '—';
      const lo = Math.min(...nums);
      const hi = Math.max(...nums);
      return lo === hi ? String(lo) : `${lo}–${hi}`;
    }

    function isLineHighlighted(lineNum, mode) {
      const step = STEPS[activeStep];
      return lineInStep(lineNum, step, mode);
    }

    function anyStepHasLine(lineNum, mode) {
      return STEPS.some((s, idx) => lineInStep(lineNum, s, mode));
    }

    function renderCodeBlock(containerId, rows, mode) {
      const step = STEPS[activeStep];
      const el = document.getElementById(containerId);
      const html = rows.map((row) => {
        const { num, text } = parseLine(row);
        const active = isLineHighlighted(num, mode);
        const linked = anyStepHasLine(num, mode);
        const dim = linked && !active ? ' dim' : '';
        const gutterCls = linked ? 'linked' : '';
        const hl = mode === 'py' ? highlightPython(text) : highlightPseudo(text);
        return `<div class="line${active ? ' active' : ''}${dim}" data-line="${num}" data-mode="${mode}">
          <span class="gutter ${gutterCls}">${num}</span>
          <span class="src">${hl}</span>
        </div>`;
      }).join('');
      el.innerHTML = html;
      el.querySelectorAll('.line').forEach((line) => {
        const n = parseInt(line.dataset.line, 10);
        const m = line.dataset.mode;
        if (!anyStepHasLine(n, m)) return;
        line.style.cursor = 'pointer';
        line.addEventListener('click', () => {
          const idx = STEPS.findIndex((s) => lineInStep(n, s, m));
          if (idx >= 0) selectStep(idx);
        });
      });
      const nums = lineNumsForStep(step, mode);
      const first = Math.min(...nums);
      const target = el.querySelector(`.line[data-line="${first}"]`);
      if (target) target.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    function renderVars() {
      const step = STEPS[activeStep];
      document.getElementById('var-step-title').textContent = `Step ${step.id}: ${step.title}`;
      document.getElementById('var-foot').textContent = step.foot || '';
      const tbody = document.getElementById('var-tbody');
      tbody.innerHTML = step.vars.map((v) => {
        const roleCls = v.role === 'read' ? 'role-read' : v.role === 'write' ? 'role-write' : 'role-both';
        const roleLabel = v.role === 'both' ? 'read/write' : v.role;
        return `<tr>
          <td class="${roleCls}">${roleLabel}</td>
          <td><code>${v.py}</code></td>
          <td>${v.paper}</td>
          <td>${v.at}</td>
        </tr>`;
      }).join('');
      document.getElementById('anchor-label').textContent = `Step ${step.id} — ${step.title}`;
      const pyN = lineNumsForStep(step, 'py');
      const psN = lineNumsForStep(step, 'pseudo');
      document.getElementById('line-xref').textContent =
        `py ${fmtSpan(pyN)} ↔ pseudo ${fmtSpan(psN)}`;
    }

    function selectStep(idx) {
      activeStep = idx;
      document.querySelectorAll('#step-nav button').forEach((b, i) => b.classList.toggle('active', i === idx));
      renderCodeBlock('code-python', PY_LINES, 'py');
      renderCodeBlock('code-pseudo', PSEUDO_LINES, 'pseudo');
      renderVars();
    }

    function setLang(next) {
      lang = next;
      document.getElementById('btn-py').classList.toggle('active', next === 'py');
      document.getElementById('btn-pseudo').classList.toggle('active', next === 'pseudo');
      document.getElementById('code-python').classList.toggle('hidden', next !== 'py');
      document.getElementById('code-pseudo').classList.toggle('hidden', next !== 'pseudo');
      document.getElementById('view-label').textContent = next === 'py' ? 'Python (repro_run.py excerpt)' : 'Pseudo (Algorithm 1)';
    }

    function buildNav() {
      const nav = document.getElementById('step-nav');
      nav.innerHTML = '<h2>Steps</h2>';
      STEPS.forEach((s, idx) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.innerHTML = `<span class="n">${s.id}</span> ${s.title}`;
        b.addEventListener('click', () => selectStep(idx));
        nav.appendChild(b);
      });
    }

    document.getElementById('btn-py').addEventListener('click', () => setLang('py'));
    document.getElementById('btn-pseudo').addEventListener('click', () => setLang('pseudo'));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'j') {
        e.preventDefault();
        selectStep(Math.min(activeStep + 1, STEPS.length - 1));
      } else if (e.key === 'ArrowUp' || e.key === 'k') {
        e.preventDefault();
        selectStep(Math.max(activeStep - 1, 0));
      } else if (e.key === 'p') setLang('py');
      else if (e.key === 'o') setLang('pseudo');
    });

    buildNav();
    selectStep(0);
    setLang('py');
  </script>
</body>
</html>

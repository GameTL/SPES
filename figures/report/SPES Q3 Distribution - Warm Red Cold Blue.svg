<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1548" height="1062" viewBox="0 0 1548 1062" role="img" aria-labelledby="chart-title chart-description" font-family="Arial, Helvetica, sans-serif">
  <title id="chart-title">Why Q3 lands where it does</title>
  <desc id="chart-description">Four 100% stacked bars show the shares of test functions or apps with zero, some, or all invocations cold in each SPES replay. A black line marks the 75th percentile. Huawei is the only full replay where this line falls in the zero-cold segment.</desc>
  <!-- Sources: SPES replay invocation and cold-start counts. Azure 2019 uses result/func_invok_rebuilt.json and result/func_cold_08-23-43.json. Other rows use result/runs/{azure2021_corr,huawei_all,ibm}/func_{invok,cold}.json. Q3 uses linear interpolation over per-unit cold starts divided by invocations. -->
  <rect x="0" y="0" width="1548" height="1062" fill="#f8f8f7" />
  <text x="28" y="69" font-size="46" fill="#101010" font-weight="700" text-anchor="start">Why Q3 lands where it does</text>
  <text x="28" y="130" font-size="31" fill="#50504e" font-weight="400" text-anchor="start">Each bar ranks test functions or apps by their cold-start rate in the SPES replay.</text>
  <text x="28" y="179" font-size="31" fill="#50504e" font-weight="400" text-anchor="start">The 75% line marks Q3. The columns on the right show the always-cold share and the Q3 rate.</text>
  <rect x="28" y="226" width="28" height="28" fill="#c84426" rx="4" />
  <text x="70" y="249" font-size="31" fill="#50504e" font-weight="400" text-anchor="start">No cold starts</text>
  <rect x="310" y="226" width="28" height="28" fill="#d3d3ca" rx="4" />
  <text x="352" y="249" font-size="31" fill="#50504e" font-weight="400" text-anchor="start">Some cold starts</text>
  <rect x="634" y="226" width="28" height="28" fill="#2872c8" rx="4" />
  <text x="676" y="249" font-size="31" fill="#50504e" font-weight="400" text-anchor="start">Always cold</text>
  <line x1="386.0" y1="334" x2="386.0" y2="901" stroke="#deded5" stroke-width="1.6" />
  <text x="386.0" y="942" font-size="27" fill="#50504e" font-weight="400" text-anchor="start">0%</text>
  <line x1="604.0" y1="334" x2="604.0" y2="901" stroke="#deded5" stroke-width="1.6" />
  <text x="604.0" y="942" font-size="27" fill="#50504e" font-weight="400" text-anchor="middle">25%</text>
  <line x1="822.0" y1="334" x2="822.0" y2="901" stroke="#deded5" stroke-width="1.6" />
  <text x="822.0" y="942" font-size="27" fill="#50504e" font-weight="400" text-anchor="middle">50%</text>
  <line x1="1040.0" y1="334" x2="1040.0" y2="901" stroke="#deded5" stroke-width="1.6" />
  <text x="1040.0" y="942" font-size="27" fill="#50504e" font-weight="400" text-anchor="middle">75%</text>
  <line x1="1258.0" y1="334" x2="1258.0" y2="901" stroke="#deded5" stroke-width="1.6" />
  <text x="1258.0" y="942" font-size="27" fill="#50504e" font-weight="400" text-anchor="end">100%</text>
  <line x1="386" y1="901" x2="1258" y2="901" stroke="#bebeb0" stroke-width="1.8" />
  <text x="1040.0" y="313" font-size="29" fill="#101010" font-weight="700" text-anchor="middle">75th percentile</text>
  <text x="1342" y="313" font-size="25" fill="#101010" font-weight="700" text-anchor="middle">Always cold</text>
  <text x="1473" y="313" font-size="25" fill="#101010" font-weight="700" text-anchor="middle">Q3</text>
